name: Main CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Job 1: Backend Testing and Linting
  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set Git to use LF line endings (backend)
        run: git config --global core.autocrlf input

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.3
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies (Backend)
        run: poetry install --no-interaction --no-ansi

      - name: Run Linting (Backend)
        run: |
          poetry run isort --check-only --profile black --line-length 88 .
          poetry run ruff check --line-length 88 .
          poetry run ruff format --check .

      - name: Run Tests (Backend)
        run: poetry run pytest

  # Job 2: RAG Agent Testing and Linting
  rag_agent:
    name: RAG Agent Pipeline
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: rag_agent

    steps:
      - uses: actions/checkout@v4

      - name: Set Git to use LF line endings (rag_agent)
        run: git config --global core.autocrlf input

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.3
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies (RAG Agent)
        run: poetry install --no-interaction --no-ansi

      - name: Run Linting (RAG Agent)
        run: |
          poetry run isort --check-only --profile black --line-length 88 .
          poetry run ruff check --line-length 88 .
          poetry run ruff format --check .

      - name: Run Tests (RAG Agent)
        run: poetry run pytest

  # Job 3: Frontend Testing and Linting
  frontend:
    name: Frontend (React/Next.js)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set Git to use LF line endings (frontend)
        run: git config --global core.autocrlf input

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies (Frontend)
        run: npm ci

      - name: Run Prettier & Lint (Frontend)
        run: |
          npx prettier --check .
          npm run lint

      - name: Run Tests (Frontend)
        run: npm run test --if-present

  # Job 4: Docker image build validation (push: false; not a delivery/CD stage)
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, rag_agent]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: discord-rag-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build RAG agent Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./rag_agent/Dockerfile
          push: false
          tags: discord-rag-agent:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: discord-rag-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build bot Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./bots
          file: ./bots/Dockerfile
          push: false
          tags: discord-rag-bot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job 5: Backend Bandit — full report is informational; high/high is a blocking gate.
  # Policy: scan backend/app only (not rag_agent or bots), keep the complete JSON
  # artifact, and fail the job on HIGH severity + HIGH confidence findings.
  security-scan:
    name: Backend Security Scan (Bandit high/high)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.3
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        working-directory: ./backend
        run: |
          poetry install --no-interaction --no-ansi

      - name: Write complete Bandit report (informational artifact)
        working-directory: ./backend
        run: |
          poetry run bandit -r app -f json -o bandit-report.json --exit-zero

      - name: Enforce Bandit high-severity/high-confidence gate
        working-directory: ./backend
        run: |
          poetry run bandit -r app --severity-level high --confidence-level high

      - name: Upload security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: backend/bandit-report.json
          retention-days: 30

  # Job 6: Final Integration Check (depends on all previous blocking jobs)
  integration-check:
    name: Integration Check
    runs-on: ubuntu-latest
    needs: [backend, rag_agent, frontend, docker-build, security-scan]

    steps:
      - name: All checks passed
        run: |
          echo "All CI checks passed successfully!"
          echo "Backend tests and linting: PASSED"
          echo "RAG Agent tests and linting: PASSED"
          echo "Frontend tests, Prettier, and ESLint: PASSED"
          echo "Docker image build validation: PASSED"
          echo "Backend Bandit high-severity/high-confidence gate: PASSED"
