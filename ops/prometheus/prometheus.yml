global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

# Optional scrape jobs (for example the Discord bot) live in extra files.
# Paths are relative to Prometheus's working directory (/prometheus in the
# official image), so this glob must be absolute to match the Compose mount
# at /etc/prometheus/scrape.d. Default Compose mounts an empty scrape.d.
# The Discord overlay replaces that directory with scrape.d.discord.
scrape_config_files:
  - /etc/prometheus/scrape.d/*.yml

scrape_configs:
  # Prometheus itself monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # FastAPI backend metric collection
  - job_name: "fastapi-backend"
    static_configs:
      - targets: ["api:8001"] # access container name within Docker network
    metrics_path: "/metrics"
    scrape_interval: 10s
    scrape_timeout: 5s

  # Weaviate metric (if enabled)
  - job_name: "weaviate"
    static_configs:
      - targets: ["weaviate:8080"]
    # Newer Weaviate versions expose metrics under /v1/metrics
    metrics_path: "/v1/metrics"
    scrape_interval: 30s
    scrape_timeout: 10s
