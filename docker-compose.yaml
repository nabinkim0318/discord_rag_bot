version: "3.9"

# Local/portfolio development topology only.
# Host-published ports bind to loopback. Internal service-to-service
# traffic continues to use Docker DNS names on app_net / monitoring.
# This file is not a production deployment.

services:
  # ==================== Vector Database ====================
  weaviate:
    image: semitechnologies/weaviate:1.24.10
    container_name: weaviate
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - ./.env
    environment:
      CLUSTER_HOSTNAME: weaviate-1
      QUERY_DEFAULTS_LIMIT: "${WEAVIATE_QUERY_LIMIT:-25}"
      # Local-dev only: anonymous access is disabled. Backend and Weaviate
      # must share WEAVIATE_API_KEY. Do not treat this as production-safe.
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "${WEAVIATE_ANONYMOUS_ACCESS_ENABLED:-false}"
      AUTHENTICATION_APIKEY_ENABLED: "true"
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: "${WEAVIATE_API_KEY:-local-dev-weaviate-api-key}"
      AUTHENTICATION_APIKEY_USERS: "${WEAVIATE_APIKEY_USER:-local-dev}"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "text2vec-openai"
      ENABLE_MODULES: "text2vec-openai"
      OPENAI_APIKEY: "${OPENAI_API_KEY}"
      PROMETHEUS_MONITORING_ENABLED: "true"
    volumes:
      - weaviate_data:/var/lib/weaviate
    networks:
      - app_net
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://localhost:8080/v1/.well-known/ready >/dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================== Backend API ====================
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: discord-rag-api
    env_file:
      - ./.env
    environment:
      SERVICE_CONTEXT: backend
      WEAVIATE_URL: "${WEAVIATE_URL:-http://weaviate:8080}"
      WEAVIATE_API_KEY: "${WEAVIATE_API_KEY:-local-dev-weaviate-api-key}"
    volumes:
      - ./backend:/app
      - ./rag_agent:/app/rag_agent
    ports:
      - "127.0.0.1:8001:8001"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001
    depends_on:
      weaviate:
        condition: service_healthy
    networks:
      - app_net
      - monitoring
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://127.0.0.1:8001/api/v1/health/livez",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s

  # ==================== Discord Bot ====================
  # Optional: `docker compose --profile discord up`.
  # Prometheus does not scrape the optional bot exporter unless the Discord
  # overlay is also applied: -f docker-compose.yaml -f docker-compose.discord.yaml
  bot:
    build:
      context: ./bots
      dockerfile: Dockerfile
    container_name: discord-rag-bot
    env_file:
      - ./.env
    environment:
      SERVICE_CONTEXT: bot
      DISCORD_BOT_TOKEN: "${DISCORD_BOT_TOKEN}"
      DISCORD_TEST_GUILD_ID: "${DISCORD_TEST_GUILD_ID}"
      DISCORD_CLIENT_ID: "${DISCORD_CLIENT_ID}"
      DISCORD_GUILD_ID: "${DISCORD_GUILD_ID}"
      USE_ASSET_EMBEDS: "${USE_ASSET_EMBEDS:-false}"
      ASSET_UP_PATH: "${ASSET_UP_PATH:-assets/thumbs-up.png}"
      ASSET_DOWN_PATH: "${ASSET_DOWN_PATH:-assets/thumbs-down.png}"
      ASSET_REGEN_PATH: "${ASSET_REGEN_PATH:-assets/refresh-page-option.png}"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app_net
    restart: unless-stopped
    profiles:
      - discord

  # ==================== Frontend ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: discord-rag-frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NEXT_PUBLIC_BACKEND_API_URL: "${NEXT_PUBLIC_BACKEND_API_URL:-http://localhost:8001/api/v1}"
      BACKEND_URL: "${BACKEND_URL:-http://api:8001}"
      NODE_ENV: "${NODE_ENV:-production}"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app_net
    restart: unless-stopped

  # ==================== Monitoring ====================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Default extra scrape dir is empty. Discord bot scrape is added only
      # via docker-compose.discord.yaml (Compose profile "discord").
      - ./ops/prometheus/scrape.d:/etc/prometheus/scrape.d:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-200h}"
      - "--web.enable-lifecycle"
    networks:
      - app_net
      - monitoring
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "127.0.0.1:3001:3000"
    env_file:
      - ./.env
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/etc/grafana/provisioning/dashboards/rag-metrics-dashboard.json"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - app_net
      - monitoring
    depends_on:
      - prometheus
    restart: unless-stopped

networks:
  app_net:
    driver: bridge
    name: discord_rag_network

  monitoring:
    driver: bridge
    name: monitoring_network

volumes:
  weaviate_data:
    driver: local

  prometheus_data:
    driver: local

  grafana_data:
    driver: local
